<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="ParisMap Video Guide">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="parismap_video_guide">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>ParisMap · iPad Pro</title>
  <link rel="manifest" href="manifest.json">

  <!-- Préchargement réseau de Material Icons (priorité haute). -->
  <link rel="preload" href="fonts/MaterialIcons-Regular.otf" as="font" type="font/otf" crossorigin>

  <style>
    :root {
      /* iPad Pro 12.9" : viewport logique 1024 x 1366 pt (portrait) */
      --w: 1024px;
      --h: 1366px;
      --radius: 46px;
      --bezel: 18px;
      --scale: 1;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: radial-gradient(circle at 50% 18%, #2a2a35 0%, #0d0d12 70%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }

    /* Mise à l'échelle pour tenir dans la fenêtre quelle que soit sa taille */
    .stage {
      transform: scale(var(--scale));
      transform-origin: center center;
    }

    /* Châssis de l'iPad (tranche aluminium + bezel noir uniforme) */
    .ipad {
      position: relative;
      border-radius: var(--radius);
      background: #0a0a0a;
      padding: var(--bezel);
      box-shadow:
        0 0 0 2px #2c2c2e,
        0 0 0 10px #3a3a3c,
        0 0 0 11px #1c1c1e,
        0 30px 90px rgba(0,0,0,.65);
    }

    /* Écran : c'est l'élément hôte de Flutter */
    #flutter-screen {
      position: relative;
      width: var(--w);
      height: var(--h);
      border-radius: calc(var(--radius) - var(--bezel));
      overflow: hidden;
      background: #ffffff;
    }

    /* Spinner affiché pendant l'init Flutter */
    .loading {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f5f7;
      z-index: 1;
    }
    .loading::after {
      content: '';
      width: 44px;
      height: 44px;
      border: 3px solid #d1d1d6;
      border-top-color: #007AFF;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Caméra frontale centrée sur le bezel haut (iPad portrait) */
    .camera {
      position: absolute;
      top: calc(var(--bezel) / 2 - 4px);
      left: 50%;
      transform: translateX(-50%);
      width: 9px;
      height: 9px;
      background: #15151a;
      border-radius: 50%;
      box-shadow: inset 0 0 0 1px #2c2c30, 0 0 2px rgba(80,120,255,.4);
      z-index: 2147483000;
    }

    /* Boutons : power (haut, droite) + volumes (droite) */
    .btn {
      position: absolute;
      background: linear-gradient(180deg, #4a4a4d, #2a2a2c);
      border-radius: 3px;
    }
    .power   { top: -8px; right: 110px; width: 70px; height: 4px; border-radius: 3px 3px 0 0; }
    .vol-up  { right: -8px; top: 90px; width: 4px; height: 56px; border-radius: 0 3px 3px 0; }
    .vol-dn  { right: -8px; top: 156px; width: 4px; height: 56px; border-radius: 0 3px 3px 0; }

    .hint {
      position: fixed;
      bottom: 12px;
      color: #8a8a96;
      font-size: 12px;
      letter-spacing: .3px;
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="ipad">
      <span class="btn power"></span>
      <span class="btn vol-up"></span>
      <span class="btn vol-dn"></span>
      <!-- Flutter rend directement dans cet élément (instance unique) -->
      <div id="flutter-screen">
        <div class="camera"></div>
        <div class="loading" id="loading-overlay"></div>
      </div>
    </div>
  </div>
  <div class="hint">ParisMap Video Guide — iPad Pro 12.9" (1024 × 1366)</div>

  <!-- Chargement Flutter ciblant hostElement = l'écran de l'iPad.
       Les jetons {{flutter_js}} et {{flutter_build_config}} sont remplaces
       par `flutter build web` (ils fournissent la config de build, sans
       laquelle l'app ne sait pas quel point d'entree charger). -->
  <script>
    // Ajuste l'échelle du châssis pour qu'il tienne entièrement dans la fenêtre.
    function fitStage() {
      const totalW = 1024 + 18 * 2 + 22; // écran + bezels + ombres latérales
      const totalH = 1366 + 18 * 2 + 22;
      const scale = Math.min(
        window.innerWidth / totalW,
        (window.innerHeight - 40) / totalH, // marge pour le libellé du bas
        1
      );
      document.documentElement.style.setProperty('--scale', scale.toFixed(4));
    }
    window.addEventListener('resize', fitStage);
    fitStage();

    {{flutter_js}}
    {{flutter_build_config}}

    window.addEventListener('load', async function () {
      // ── Préchargement Material Icons ─────────────────────────────────────────
      // On charge la police via FontFace API et on l'ajoute à document.fonts
      // AVANT de démarrer Flutter. Ainsi, quand Flutter rend la 1re frame,
      // la police est déjà disponible et aucune icône ne s'affiche en "□ X □".
      try {
        const font = new FontFace(
          'MaterialIcons',
          'url(fonts/MaterialIcons-Regular.otf) format("opentype")'
        );
        document.fonts.add(await font.load());
      } catch (_) { /* la police sera chargée par Flutter normalement */ }

      _flutter.loader.load({
        onEntrypointLoaded: async function (engineInitializer) {
          const appRunner = await engineInitializer.initializeEngine({
            hostElement: document.getElementById('flutter-screen'),
          });
          await appRunner.runApp();
          const overlay = document.getElementById('loading-overlay');
          if (overlay) overlay.remove();
        },
      });
    });
  </script>
</body>
</html>
