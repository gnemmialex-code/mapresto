<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ParisMap · iPhone 16</title>
  <style>
    :root {
      /* iPhone 16 : viewport logique 393 x 852 pt */
      --w: 393px;
      --h: 852px;
      --radius: 56px;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: radial-gradient(circle at 50% 20%, #2a2a35 0%, #0d0d12 70%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }

    /* Châssis du téléphone (titane + bordure écran noire) */
    .phone {
      position: relative;
      width: var(--w);
      height: var(--h);
      border-radius: var(--radius);
      background: #0a0a0a;
      padding: 12px;                 /* épaisseur du bezel noir */
      box-shadow:
        0 0 0 2px #2c2c2e,           /* liseré interne */
        0 0 0 12px #3a3a3c,          /* tranche titane */
        0 0 0 13px #1c1c1e,          /* arête externe */
        0 30px 80px rgba(0,0,0,.65); /* ombre portée */
    }

    /* Écran + recadrage */
    .screen {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: calc(var(--radius) - 12px);
      overflow: hidden;
      background: #fff;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    /* Dynamic Island */
    .island {
      position: absolute;
      top: 11px;
      left: 50%;
      transform: translateX(-50%);
      width: 124px;
      height: 35px;
      background: #000;
      border-radius: 20px;
      z-index: 10;
      pointer-events: none;
    }

    /* Boutons latéraux */
    .btn {
      position: absolute;
      background: linear-gradient(180deg, #4a4a4d, #2a2a2c);
      border-radius: 2px 0 0 2px;
    }
    .btn.right { border-radius: 0 2px 2px 0; }
    .action  { left: -15px; top: 130px; width: 4px; height: 30px; }
    .vol-up  { left: -15px; top: 185px; width: 4px; height: 58px; }
    .vol-dn  { left: -15px; top: 255px; width: 4px; height: 58px; }
    .power   { right: -15px; top: 205px; width: 4px; height: 95px; }

    .hint {
      position: fixed;
      bottom: 14px;
      color: #8a8a96;
      font-size: 12px;
      letter-spacing: .3px;
    }
  </style>
</head>
<body>
  <div class="phone">
    <span class="btn action"></span>
    <span class="btn vol-up"></span>
    <span class="btn vol-dn"></span>
    <span class="btn right power"></span>
    <div class="screen">
      <div class="island"></div>
      <!-- L'app Flutter est servie au même origine ("/") -->
      <iframe src="/" title="ParisMap Video Guide"></iframe>
    </div>
  </div>
  <div class="hint">ParisMap Video Guide — maquette iPhone 16 (393 × 852)</div>
</body>
</html>
